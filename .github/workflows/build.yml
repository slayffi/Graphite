name: Build

# Every commit: tests, Android APKs and the Windows MSI.
# A release (the same builds published on the Releases page) is made by pushing the tag v<version>, or by
# running this workflow by hand with "release" set; see "Выпуск релиза" in the README.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'GitHub release from this commit'
        type: choice
        # add-files: upload what a published release of this version does not have yet; nothing is replaced
        options: ['no', 'draft', 'publish', 'add-files']
        default: 'no'
      temporary_key:
        description: 'Allow APKs signed with a throw-away key (they cannot be updated later)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.release || 'no' }}
  # A newer commit replaces the run of an older one, but nothing interrupts a release.
  cancel-in-progress: ${{ (inputs.release || 'no') == 'no' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  VLC_VERSION: 3.0.21

jobs:
  tests:
    name: Unit and UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # core + data run real libtorrent sessions on localhost; the UI tests render offscreen (no display needed).
      - name: Run tests
        run: ./gradlew :core:desktopTest :data:desktopTest :ui:designsystem:desktopTest :ui:app:desktopTest :platform:desktop:test --continue
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            ui/designsystem/build/gallery/
          retention-days: 14

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Optional release signing: add the secrets GRAPHITE_KEYSTORE_BASE64, GRAPHITE_KEYSTORE_PASSWORD,
      # GRAPHITE_KEY_ALIAS and GRAPHITE_KEY_PASSWORD. Without them the release APK is signed with the debug key.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GRAPHITE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/graphite.keystore"
            echo "GRAPHITE_KEYSTORE_FILE=$RUNNER_TEMP/graphite.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build APKs
        env:
          GRAPHITE_KEYSTORE_PASSWORD: ${{ secrets.GRAPHITE_KEYSTORE_PASSWORD }}
          GRAPHITE_KEY_ALIAS: ${{ secrets.GRAPHITE_KEY_ALIAS }}
          GRAPHITE_KEY_PASSWORD: ${{ secrets.GRAPHITE_KEY_PASSWORD }}
        run: ./gradlew :platform:android:assembleRelease :platform:android:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: graphite-android
          path: |
            platform/android/build/outputs/apk/release/*.apk
            platform/android/build/outputs/apk/debug/*universal*.apk
          retention-days: 30

  # The release APK is started on a real Android: R8 problems and crashes in library initializers (both
  # happened) are invisible to JVM tests. Needs hardware acceleration; without it the check is skipped.
  android-smoke:
    name: Android start-up check
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: graphite-android
          path: apk
      # The runner image is nearly full (about 5 GB free), the emulator needs more for its data partition.
      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk
          df -h / | tail -1
      - name: Check hardware acceleration (KVM)
        id: kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sleep 2
          ls -la /dev/kvm || true
          df -h / | tail -1
          free -m | sed -n 2p
          ls apk/release/
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No KVM on this runner: the emulator start-up check was skipped."
          fi
      - name: Start the release APK on an emulator
        if: steps.kvm.outputs.available == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          disable-animations: true
          disk-size: 3072M
          emulator-boot-timeout: 420
          script: bash tools/android_smoke_test.sh apk/release/android-x86_64-release.apk 240
      - name: Emulator diagnostics
        if: failure()
        run: |
          df -h / | tail -1
          free -m | sed -n 2p
          ls -la /dev/kvm || true
          ls -la "$HOME/.android/avd" || true
          "$ANDROID_HOME/emulator/emulator" -accel-check || true
          timeout 45 "$ANDROID_HOME/emulator/emulator" -avd test -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim 2>&1 | head -60 || true
      - name: Upload start-up check output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-test
          path: build/smoke/
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: Windows installers
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The built-in player uses libVLC (LGPL 2.1+). Only libvlc, libvlccore and the plugins are bundled.
      - name: Download libVLC ${{ env.VLC_VERSION }}
        shell: pwsh
        run: |
          $base = "https://download.videolan.org/pub/videolan/vlc/$env:VLC_VERSION/win64"
          $zip = "$env:RUNNER_TEMP\vlc.zip"
          Invoke-WebRequest "$base/vlc-$env:VLC_VERSION-win64.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA-256: $hash"
          $expected = $null
          try {
            Invoke-WebRequest "$base/vlc-$env:VLC_VERSION-win64.zip.sha256" -OutFile "$zip.sha256"
            $expected = ((Get-Content "$zip.sha256" -Raw).Trim() -split '\s+')[0].ToLower()
          } catch { Write-Host "No published checksum file, continuing" }
          if ($expected -and $expected -ne $hash) { throw "VLC checksum mismatch: $hash != $expected" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\vlc"
          $src = Get-ChildItem "$env:RUNNER_TEMP\vlc" -Directory | Select-Object -First 1
          $dst = "platform\desktop\resources\windows\vlc"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item "$($src.FullName)\libvlc.dll", "$($src.FullName)\libvlccore.dll", "$($src.FullName)\COPYING.txt" $dst
          Copy-Item "$($src.FullName)\plugins" $dst -Recurse
          # Interfaces, skins and Lua scripts are not used by an embedded player.
          Remove-Item "$dst\plugins\gui", "$dst\plugins\lua" -Recurse -Force -ErrorAction SilentlyContinue
      - name: Build the installers (.exe and .msi)
        run: ./gradlew.bat :platform:desktop:packageExe :platform:desktop:packageMsi
      # The package is installed and started for real: a Java module missing from the bundled runtime or a
      # native library that does not load on a clean Windows shows up only here.
      - name: Install with the .exe and start Graphite
        shell: pwsh
        run: |
          $installer = Get-ChildItem platform\desktop\build\compose\binaries\main\exe\*.exe | Select-Object -First 1
          if (-not $installer) { throw "The .exe installer was not built" }
          Write-Host "Installing $($installer.Name) ($([math]::Round($installer.Length / 1MB)) MB)"
          $log = "$env:RUNNER_TEMP\install.log"
          $setup = Start-Process $installer.FullName -ArgumentList '/qn', '/norestart', '/l*v', "`"$log`"" -PassThru
          $null = $setup.Handle   # without this PowerShell forgets the exit code of a process it did not wait for
          if (-not $setup.WaitForExit(600000)) { $setup.Kill(); throw "The installer did not finish in 10 minutes (it must work without questions with /qn)" }
          if ($setup.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 60 }
            throw "The installer failed with code $($setup.ExitCode)"
          }
          $app = @("$env:LOCALAPPDATA\Graphite\Graphite.exe", "$env:ProgramFiles\Graphite\Graphite.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $app) { throw "Graphite.exe was not installed" }
          Write-Host "Installed: $app"

          $report = "$env:RUNNER_TEMP\self-test.txt"
          $run = Start-Process $app -ArgumentList '--self-test', "`"$report`"" -PassThru
          $null = $run.Handle
          $finished = $run.WaitForExit(240000)
          if (Test-Path $report) { Get-Content $report } else { Write-Host "No self-test report was written" }
          if (-not $finished) { $run.Kill(); throw "Graphite did not finish its self-test in 4 minutes" }
          if ($run.ExitCode -ne 0) { throw "Graphite self-test failed with code $($run.ExitCode)" }
          $text = Get-Content $report -Raw
          if ($text -notmatch 'RESULT: PASSED') { throw "The self-test did not pass" }
          if ($text -notmatch 'libVLC found') { throw "The bundled player (libVLC) was not found by the installed app" }
      - uses: actions/upload-artifact@v4
        with:
          name: graphite-windows
          path: |
            platform/desktop/build/compose/binaries/main/exe/*.exe
            platform/desktop/build/compose/binaries/main/msi/*.msi
          retention-days: 30

  # Publishes what the jobs above built and checked; nothing is built here.
  release:
    name: GitHub release
    needs: [tests, android, android-smoke, windows]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != 'no')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: graphite-android
          path: dist/android
      - uses: actions/download-artifact@v4
        with:
          name: graphite-windows
          path: dist/windows
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.release }}
          HAS_KEY: ${{ secrets.GRAPHITE_KEYSTORE_BASE64 != '' }}
          TEMPORARY_KEY_OK: ${{ inputs.temporary_key }}
        run: bash tools/make_release.sh
